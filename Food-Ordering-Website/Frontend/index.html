<!DOCTYPE html>
<html>

<head>

    <title>Food Ordering Website</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav>

        <h1>Food Express</h1>

        <div>

            <a href="index.html">Home</a>

            <a href="cart.html">Cart</a>

            <a href="admin.html">Admin</a>

            <button id="dark-btn">
                🌙
            </button>

        </div>

    </nav>

    <!-- Hero Banner -->

    <section class="hero">

        <a href="menu.html">

            <button class="hero-btn">
                Order Now
            </button>

        </a>

    </section>

    <!-- Section Title -->

    <h2 class="section-title">

        Popular Restaurants

        <br>

        <span>★★★★★</span>

    </h2>

    <!-- Restaurant Cards -->

    <div class="restaurant-container">

        <!-- Pizza -->

        <div class="restaurant-card">

            <img
                src="https://images.unsplash.com/photo-1513104890138-7c749659a591"
                alt="Pizza Hut"
            >

            <h3>Pizza Hut</h3>

            <p>Best Pizza In Town</p>

            <a href="menu.html">

                <button>
                    View Menu
                </button>

            </a>

        </div>

        <!-- Burger -->

        <div class="restaurant-card">

            <img
                src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
                alt="Burger King"
            >

            <h3>Burger King</h3>

            <p>Delicious Burgers</p>

            <a href="menu.html">

                <button>
                    View Menu
                </button>

            </a>

        </div>

        <!-- Biryani -->

        <div class="restaurant-card">

            <img
                src="images/biryani.jpg"
                alt="Biryani House"
            >

            <h3>Biryani House</h3>

            <p>Hyderabadi Special</p>

            <a href="menu.html">

                <button>
                    View Menu
                </button>

            </a>

        </div>

    </div>

    <!-- Script -->

    <script src="script.js"></script>

</body>

</html>
